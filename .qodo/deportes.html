<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportes</title>
    <link rel="stylesheet" href="deportes.css">
</head>
<body>

    <section class="carousel-container">
        <button class="prev-btn">❮</button>
        
        <div class="carousel-window">
            <div class="carousel-track">
                
                <a href="#" class="product-item">
                    <div class="product-card">
                        <img src="pictures/pelotafutbol.jpg" alt="Balón de fútbol">
                        <div class="info">
                            <p class="brand">Adidas</p>
                            <p class="desc">Balón de fútbol clásico</p>
                            <p class="price">$599.00</p>
                        </div>
                    </div>
                </a>

                <a href="#" class="product-item">
                    <div class="product-card">
                        <img src="pictures/gimnasialistones.jpg" alt="Cintas para gimnasia">
                        <div class="info">
                            <p class="brand">Sport</p>
                            <p class="desc">Cintas para gimnasia rítmica</p>
                            <p class="price">$320.00</p>
                        </div>
                    </div>
                </a>

                <a href="#" class="product-item">
                    <div class="product-card">
                        <img src="pictures/pesas.jpg" alt="Pesas">
                        <div class="info">
                            <p class="brand">Fitness</p>
                            <p class="desc">Par de pesas 5kg</p>
                            <p class="price">$850.00</p>
                        </div>
                    </div>
                </a>

                  <a href="#" class="product-item">
                    <div class="product-card">
                        <img src="pictures/aletas natacion.webp" alt="Aletas de natación">
                        <div class="info">
                            <p class="brand">Sport</p>
                            <p class="desc">Aletas de natación</p>
                            <p class="price">$400.00</p>
                        </div>
                    </div>
                </a>

                </div>
        </div>

        <button class="next-btn">❯</button>

        <div class="view-more-section">
            <a href="https://www.marti.mx/deportes" target="_blank" class="view-more-btn">Ver más</a>
        </div>
    </section>

    <script src="deportes.js"></script>
</body>
</html>
